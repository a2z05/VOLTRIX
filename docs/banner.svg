<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080E"/>
      <stop offset="0.55" stop-color="#0A0D18"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4EEFF"/>
      <stop offset="1" stop-color="#7FA6FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FD8FF"/>
      <stop offset="1" stop-color="#3E7BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.24" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#2E5BFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#1B3B8F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#7F86FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#halo)"/>
  <rect x="8" y="8" width="1184" height="384" rx="18" fill="none" stroke="#FFC53D" stroke-opacity="0.65"/>
  <rect x="14" y="14" width="1172" height="372" rx="14" fill="url(#grid)"/>

  <!-- mark: bolt inside a broken ring, gaps top & bottom (same DNA as the app icon) -->
  <g transform="translate(340 200)" filter="url(#glow)">
    <circle r="112" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"
            stroke-dasharray="293 58 293 58" transform="rotate(102)"/>
    <path d="M18 -96 L-38 6 L8 6 L-24 96 L40 -12 L-6 -12 Z" fill="url(#bolt)"/>
  </g>

  <text x="620" y="188" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="96" font-weight="800"
        letter-spacing="6" fill="#FFC53D" text-shadow="0 0 24px rgba(255,197,61,0.45)">67W</text>
  <rect x="622" y="212" width="330" height="3" rx="1.5" fill="#FFC53D" opacity="0.9"/>
  <text x="620" y="262" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="34" font-weight="700"
        letter-spacing="10" fill="#DDE6FF">FULL-CHARGE UNLOCK</text>
  <text x="620" y="306" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="22" font-weight="500"
        fill="#9AA7FF">root charging control</text>
</svg>
