name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Decode release keystore
        env:
          VOLTRIX_KEYSTORE_B64: ${{ secrets.VOLTRIX_KEYSTORE_B64 }}
        run: echo "$VOLTRIX_KEYSTORE_B64" | base64 -d > app/android/app/release.keystore

      - name: npm install
        working-directory: app
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          VOLTRIX_KS_PASS: ${{ secrets.VOLTRIX_KS_PASS }}
          VOLTRIX_KS_ALIAS: ${{ secrets.VOLTRIX_KS_ALIAS }}
          VOLTRIX_KS_KEY_PASS: ${{ secrets.VOLTRIX_KS_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package module zip with APK
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          mkdir -p module/app
          cp app/android/app/build/outputs/apk/release/app-release.apk module/app/VOLTRIX.apk
          (cd module && zip -qr "../VOLTRIX-${VERSION}.zip" .)
          echo "Packaged VOLTRIX-${VERSION}.zip:"
          unzip -l "VOLTRIX-${VERSION}.zip" | tail -5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VOLTRIX-build
          path: |
            VOLTRIX-*.zip
            app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          TAG="v${VERSION#v}"
          APK=app/android/app/build/outputs/apk/release/app-release.apk
          NOTES="VOLTRIX ${VERSION} — Magisk/KernelSU module zip + companion APK, built by CI."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "VOLTRIX-${VERSION}.zip" "$APK" --clobber
          else
            gh release create "$TAG" "VOLTRIX-${VERSION}.zip" "$APK" \
              --title "VOLTRIX ${VERSION}" --notes "$NOTES"
          fi
