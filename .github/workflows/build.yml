name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK packages
        run: |
          set -u
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Refresh cmdline-tools first: an old sdkmanager cannot see newly published platforms.
          "$SDKMANAGER" "cmdline-tools;latest" >/dev/null 2>&1 || true
          [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || true
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"; then
            echo "platforms;android-37 is not a published id — discovering the real one"
            LIST=$("$SDKMANAGER" --list 2>/dev/null || true)
            # Prefer the requested 37 series, base first (e.g. android-37.0 over 37.2/betas);
            # fall back to the newest numeric platform in the whole repo.
            P=$(echo "$LIST" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -uV | head -1 || true)
            [ -n "$P" ] || P=$(echo "$LIST" | grep -oE 'platforms;android-[0-9]+(\.[0-9]+)?' | sort -uV | tail -1 || true)
            echo "discovered platform package: $P"
            "$SDKMANAGER" "platform-tools" "$P" "build-tools;37.0.0"
          fi
          # compileSdk in the template is the INTEGER 37 and must stay an integer:
          # a dotted string ("37.2") silently casts to null in Groovy and AGP throws
          # "Value is null". If the SDK only published versioned dirs (android-37.0),
          # also expose the plain name AGP may look up for int 37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            SRC=$( (ls -1d "$ANDROID_HOME"/platforms/android-37.* 2>/dev/null || true) | sort -V | head -1 || true)
            if [ -n "$SRC" ]; then
              ln -s "$(basename "$SRC")" "$ANDROID_HOME/platforms/android-37"
              echo "linked platforms/android-37 -> $(basename "$SRC")"
            fi
          fi
          # buildToolsVersion is a String — sync it to the installed dir.
          BT=$( (ls -1 "$ANDROID_HOME/build-tools" || true) | sed -n '/^[0-9]/p' | sort -V | tail -1)
          echo "installed build-tools: $BT"
          sed -i "/buildToolsVersion =/s/=.*/= \"$BT\"/" app/android/build.gradle
          grep -nE 'SdkVersion|buildToolsVersion' app/android/build.gradle

      - name: Decode release keystore
        env:
          VOLTRIX_KEYSTORE_B64: ${{ secrets.VOLTRIX_KEYSTORE_B64 }}
        run: echo "$VOLTRIX_KEYSTORE_B64" | base64 -d > app/android/app/release.keystore

      - name: npm install
        working-directory: app
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          VOLTRIX_KS_PASS: ${{ secrets.VOLTRIX_KS_PASS }}
          VOLTRIX_KS_ALIAS: ${{ secrets.VOLTRIX_KS_ALIAS }}
          VOLTRIX_KS_KEY_PASS: ${{ secrets.VOLTRIX_KS_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package module zip with APK
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          mkdir -p module/app
          cp app/android/app/build/outputs/apk/release/app-release.apk module/app/VOLTRIX.apk
          (cd module && zip -qr "../VOLTRIX-${VERSION}.zip" .)
          echo "Packaged VOLTRIX-${VERSION}.zip:"
          unzip -l "VOLTRIX-${VERSION}.zip" | tail -5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VOLTRIX-build
          path: |
            VOLTRIX-*.zip
            app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          TAG="v${VERSION#v}"
          APK=app/android/app/build/outputs/apk/release/app-release.apk
          NOTES="VOLTRIX ${VERSION} — Magisk/KernelSU module zip + companion APK, built by CI."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "VOLTRIX-${VERSION}.zip" "$APK" --clobber
          else
            gh release create "$TAG" "VOLTRIX-${VERSION}.zip" "$APK" \
              --title "VOLTRIX ${VERSION}" --notes "$NOTES"
          fi
